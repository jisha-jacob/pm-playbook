services:
  postgres:
    image: postgres:16
    container_name: pm-playbook-postgres
    environment:
      POSTGRES_DB: pm_playbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pm_playbook_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d pm_playbook",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pm_playbook_postgres_data:
